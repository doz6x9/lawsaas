name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Validate HUN court CSV
        run: |
          node -e "const fs=require('node:fs'); const Papa=require('papaparse'); const path='public/hunconcourt.csv'; if(!fs.existsSync(path)){throw new Error('Missing public/hunconcourt.csv')} const csv=fs.readFileSync(path,'utf8'); const parsed=Papa.parse(csv,{header:true,skipEmptyLines:'greedy'}); if(parsed.errors.length){throw new Error(parsed.errors[0].message)} if(parsed.data.length < 1000){throw new Error('Expected at least 1000 HUN court rows')} console.log(JSON.stringify({rows: parsed.data.length, firstDecision: parsed.data[0]['Decision ID']}));"
