name: Deploy Production

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - master
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Vercel production deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CONFIGURED: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    steps:
      - name: Skip until Vercel secrets are configured
        if: env.VERCEL_CONFIGURED != 'true'
        run: |
          echo "Skipping Vercel deployment because VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID is missing."
          echo "Add the secrets in GitHub repository settings to enable production CD."

      - uses: actions/checkout@v4
        if: env.VERCEL_CONFIGURED == 'true'

      - uses: actions/setup-node@v4
        if: env.VERCEL_CONFIGURED == 'true'
        with:
          node-version: 20

      - name: Install Vercel CLI
        if: env.VERCEL_CONFIGURED == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        if: env.VERCEL_CONFIGURED == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel output
        if: env.VERCEL_CONFIGURED == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        if: env.VERCEL_CONFIGURED == 'true'
        id: deploy
        shell: bash
        run: |
          DEPLOY_URL="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          echo "Deployed to ${DEPLOY_URL}"
